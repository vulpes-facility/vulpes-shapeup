name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # The queue's tests need a real PostgreSQL; this one is thrown away with the job.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: shapeup_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d shapeup_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SHAPEUP_TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/shapeup_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Unit tests
        run: node --test "test/*.test.mjs"
      - name: SVG check with a real XML parser
        run: node test/render-fixtures.mjs | python3 test/validate-svg.py
